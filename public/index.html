<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GC Attendance Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top" id="topbar" hidden>
    <h1>🇩🇪 GC Attendance</h1>
    <div class="who">Signed in as <span class="name" id="whoName"></span><a id="switchBtn">switch</a></div>
  </header>

  <nav class="tabs" id="tabsbar" hidden>
    <button data-tab="mark" class="active">Attendance</button>
    <button data-tab="report">Summary</button>
  </nav>

  <main>
    <section id="login"></section>
    <section id="tab-mark" hidden></section>
    <section id="tab-report" hidden></section>
  </main>

  <div class="toast" id="toast"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
