<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GC Buddy — Admissions Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --bg: #f4f5f9;
      --card: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --blue: #3b82f6;
      --green: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --indigo: #6366f1;
      --radius: 10px;
      --shadow: 0 1px 4px rgba(0,0,0,0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    a { color: var(--indigo); }
    
    /* Layout */
    .wrapper { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
    
    /* Topbar */
    .topbar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; gap: 16px; flex-wrap: wrap; }
    .topbar-left h1 { font-size: 22px; font-weight: 700; }
    .topbar-left p { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .last-updated { font-size: 12px; color: var(--muted); }
    
    /* Buttons */
    button { cursor: pointer; font-family: inherit; }
    .btn { padding: 8px 16px; border-radius: 7px; font-size: 13px; font-weight: 500; border: none; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--indigo); color: #fff; }
    .btn-ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
    .btn:disabled { opacity: .5; cursor: default; }
    
    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
    @media (max-width: 600px) { .stats { grid-template-columns: 1fr; } }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
    .stat-value { font-size: 36px; font-weight: 700; margin-top: 8px; }
    .stat-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .blue  { color: var(--blue); }
    .green { color: var(--green); }
    .amber { color: var(--amber); }
    
    /* Panel */
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
    .panel-head { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; outline: none; font-family: inherit; }
    .search-box:focus { border-color: var(--indigo); }
    select.filter { padding: 8px 12px; border: 1px solid var(--border); border-radius: 7px; font-size: 13px; outline: none; font-family: inherit; background: #fff; }
    
    /* Table */
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { background: #f9fafb; padding: 11px 16px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; white-space: nowrap; cursor: pointer; user-select: none; }
    thead th:hover { background: #f1f2f5; }
    thead th .sort-icon { margin-left: 4px; opacity: .5; }
    thead th.active .sort-icon { opacity: 1; color: var(--indigo); }
    tbody tr { border-top: 1px solid var(--border); }
    tbody tr:hover { background: #fafbff; }
    td { padding: 11px 16px; vertical-align: middle; }
    .td-id { color: var(--muted); font-size: 12px; width: 60px; }
    .td-name { font-weight: 500; }
    .td-phone { font-family: monospace; font-size: 12px; color: var(--muted); }
    .td-date { font-size: 12px; color: var(--muted); white-space: nowrap; }
    .td-stage { }
    
    /* Badges */
    .badge { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; white-space: nowrap; }
    .badge-green  { background: #d1fae5; color: #065f46; }
    .badge-amber  { background: #fef3c7; color: #92400e; }
    .badge-blue   { background: #dbeafe; color: #1e40af; }
    .badge-gray   { background: #f3f4f6; color: #4b5563; }
    
    /* Stage pill */
    .stage-pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 11px; font-weight: 500; background: #f3f4f6; color: #374151; }
    
    /* Pagination */
    .pagination { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; border-top: 1px solid var(--border); font-size: 13px; color: var(--muted); flex-wrap: wrap; gap: 8px; }
    .page-btns { display: flex; gap: 6px; }
    .page-btn { padding: 5px 12px; border-radius: 6px; border: 1px solid var(--border); background: #fff; font-size: 13px; }
    .page-btn:hover:not(:disabled) { border-color: var(--indigo); color: var(--indigo); }
    .page-btn:disabled { opacity: .4; cursor: default; }
    .page-btn.active { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    
    /* State */
    .state-box { padding: 60px 20px; text-align: center; color: var(--muted); font-size: 14px; }
    .state-box .icon { font-size: 32px; margin-bottom: 10px; }
    .spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid var(--border); border-top-color: var(--indigo); border-radius: 50%; animation: spin .7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Error banner */
    .error-banner { background: #fef2f2; border: 1px solid #fecaca; color: var(--red); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 20px; font-size: 13px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { createClient } = supabase;

  // ── CONFIG ─────────────────────────────────────────────────────────────────
  const SUPABASE_URL = 'https://lrcimdchhbsgbnvdmpwd.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxyY2ltZGNoaGJzZ2JudmRtcHdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0MzAwMzcsImV4cCI6MjA5MDAwNjAzN30.1MfNvTNGTUNuUIL-lN3vZH7Kpcn6t1naiq07KTUEDEk';
  const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const PAGE_SIZE = 25;
  // ───────────────────────────────────────────────────────────────────────────

  const { useState, useEffect, useMemo, useCallback } = React;

  function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  function fmtStage(s) {
    if (!s) return '—';
    return s.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
  }
  function SortIcon({ dir }) {
    return <span className="sort-icon">{dir === 'asc' ? '↑' : dir === 'desc' ? '↓' : '↕'}</span>;
  }

  function App() {
    const [rows, setRows]           = useState([]);
    const [loading, setLoading]     = useState(true);
    const [error, setError]         = useState(null);
    const [lastUpdated, setLastUpdated] = useState(null);
    const [search, setSearch]       = useState('');
    const [statusFilter, setStatus] = useState('all');
    const [stageFilter, setStage]   = useState('all');
    const [sortCol, setSortCol]     = useState('admitted_at');
    const [sortDir, setSortDir]     = useState('desc');
    const [page, setPage]           = useState(1);

    const load = useCallback(async () => {
      setLoading(true);
      setError(null);
      try {
        const { data, error: err } = await db
          .from('admissions')
          .select('id, candidate_name, candidate_phone, admitted_at, stage, roll_number')
          .order('admitted_at', { ascending: false });
        if (err) throw err;
        setRows(data || []);
        setLastUpdated(new Date());
      } catch(e) {
        setError(e.message || 'Failed to load data');
      } finally {
        setLoading(false);
      }
    }, []);

    useEffect(() => { load(); }, [load]);

    // Stats
    const total    = rows.length;
    const assigned = rows.filter(r => r.roll_number).length;
    const pending  = total - assigned;
    const pct      = total ? Math.round(assigned / total * 100) : 0;

    // Unique stages for filter
    const stages = useMemo(() => {
      const s = [...new Set(rows.map(r => r.stage).filter(Boolean))].sort();
      return s;
    }, [rows]);

    // Filter + sort
    const filtered = useMemo(() => {
      let q = search.toLowerCase().trim();
      let out = rows.filter(r => {
        const matchQ = !q
          || (r.candidate_name||'').toLowerCase().includes(q)
          || (r.candidate_phone||'').includes(q)
          || (r.roll_number||'').toLowerCase().includes(q);
        const matchS = statusFilter === 'all'
          || (statusFilter === 'assigned' && r.roll_number)
          || (statusFilter === 'pending'  && !r.roll_number);
        const matchStage = stageFilter === 'all' || r.stage === stageFilter;
        return matchQ && matchS && matchStage;
      });
      out = [...out].sort((a,b) => {
        let va = a[sortCol] ?? '';
        let vb = b[sortCol] ?? '';
        if (typeof va === 'string') va = va.toLowerCase();
        if (typeof vb === 'string') vb = vb.toLowerCase();
        if (va < vb) return sortDir === 'asc' ? -1 : 1;
        if (va > vb) return sortDir === 'asc' ? 1 : -1;
        return 0;
      });
      return out;
    }, [rows, search, statusFilter, stageFilter, sortCol, sortDir]);

    const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
    const pageRows   = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

    function handleSort(col) {
      if (sortCol === col) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
      else { setSortCol(col); setSortDir('asc'); }
      setPage(1);
    }
    function handleSearch(e) { setSearch(e.target.value); setPage(1); }
    function handleStatus(e) { setStatus(e.target.value); setPage(1); }
    function handleStage(e)  { setStage(e.target.value); setPage(1); }

    const cols = [
      { id: 'id',            label: 'ID' },
      { id: 'candidate_name',label: 'Name' },
      { id: 'candidate_phone',label: 'Phone' },
      { id: 'admitted_at',   label: 'Admitted On' },
      { id: 'stage',         label: 'Stage' },
      { id: 'roll_number',   label: 'Roll Number' },
    ];

    return (
      <div className="wrapper">
        {/* Topbar */}
        <div className="topbar">
          <div className="topbar-left">
            <h1>GC Buddy — Admissions</h1>
            <p>German Language Programme · Roll number tracker</p>
          </div>
          <div className="topbar-right">
            {lastUpdated && (
              <span className="last-updated">Updated {lastUpdated.toLocaleTimeString('en-IN')}</span>
            )}
            <button className="btn btn-primary" onClick={load} disabled={loading}>
              {loading ? '⟳ Loading…' : '↻ Refresh'}
            </button>
          </div>
        </div>

        {/* Error */}
        {error && (
          <div className="error-banner">
            ⚠️ {error}
            {error.includes('permission') || error.includes('policy') ? (
              <> — You may need to add a Row Level Security read policy on the <code>admissions</code> table for the <code>anon</code> role.</>
            ) : null}
          </div>
        )}

        {/* Stats */}
        <div className="stats">
          <div className="stat">
            <div className="stat-label">Total Admissions</div>
            <div className="stat-value blue">{loading ? '—' : total}</div>
            <div className="stat-sub">All time enrolments</div>
          </div>
          <div className="stat">
            <div className="stat-label">Roll Number Assigned</div>
            <div className="stat-value green">{loading ? '—' : assigned}</div>
            <div className="stat-sub">{loading ? '' : `${pct}% of total`}</div>
          </div>
          <div className="stat">
            <div className="stat-label">Pending Roll Number</div>
            <div className="stat-value amber">{loading ? '—' : pending}</div>
            <div className="stat-sub">No GC Buddy login yet</div>
          </div>
        </div>

        {/* Table panel */}
        <div className="panel">
          <div className="panel-head">
            <input
              className="search-box"
              type="text"
              placeholder="Search name, phone, roll number…"
              value={search}
              onChange={handleSearch}
            />
            <select className="filter" value={statusFilter} onChange={handleStatus}>
              <option value="all">All Statuses</option>
              <option value="assigned">Roll Assigned</option>
              <option value="pending">Pending</option>
            </select>
            <select className="filter" value={stageFilter} onChange={handleStage}>
              <option value="all">All Stages</option>
              {stages.map(s => <option key={s} value={s}>{fmtStage(s)}</option>)}
            </select>
          </div>

          {loading ? (
            <div className="state-box">
              <div className="spinner"></div>
              <div style={{marginTop:14}}>Loading admissions…</div>
            </div>
          ) : filtered.length === 0 ? (
            <div className="state-box">
              <div className="icon">🔍</div>
              <div>No results found</div>
            </div>
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    {cols.map(c => (
                      <th
                        key={c.id}
                        className={sortCol === c.id ? 'active' : ''}
                        onClick={() => handleSort(c.id)}
                      >
                        {c.label}
                        <SortIcon dir={sortCol === c.id ? sortDir : null} />
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {pageRows.map(r => (
                    <tr key={r.id}>
                      <td className="td-id">{r.id}</td>
                      <td className="td-name">{r.candidate_name || '—'}</td>
                      <td className="td-phone">{r.candidate_phone || '—'}</td>
                      <td className="td-date">{fmtDate(r.admitted_at)}</td>
                      <td>
                        {r.stage
                          ? <span className="stage-pill">{fmtStage(r.stage)}</span>
                          : <span style={{color:'var(--muted)'}}>—</span>}
                      </td>
                      <td>
                        {r.roll_number
                          ? <span className="badge badge-green">{r.roll_number}</span>
                          : <span className="badge badge-amber">Not Assigned</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {/* Pagination */}
          {!loading && filtered.length > 0 && (
            <div className="pagination">
              <span>Showing {(page-1)*PAGE_SIZE+1}–{Math.min(page*PAGE_SIZE, filtered.length)} of {filtered.length}</span>
              <div className="page-btns">
                <button className="page-btn" disabled={page===1} onClick={()=>setPage(p=>p-1)}>← Prev</button>
                {Array.from({length: Math.min(totalPages,5)}, (_,i) => {
                  let p;
                  if (totalPages <= 5) p = i+1;
                  else if (page <= 3) p = i+1;
                  else if (page >= totalPages-2) p = totalPages-4+i;
                  else p = page-2+i;
                  return (
                    <button
                      key={p}
                      className={`page-btn ${p===page?'active':''}`}
                      onClick={()=>setPage(p)}
                    >{p}</button>
                  );
                })}
                <button className="page-btn" disabled={page===totalPages} onClick={()=>setPage(p=>p+1)}>Next →</button>
              </div>
            </div>
          )}
        </div>

        <div style={{marginTop:16,fontSize:12,color:'var(--muted)',textAlign:'center'}}>
          GC Buddy Admin · Roll numbers auto-assigned on admission · Data from CRM
        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
